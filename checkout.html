<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — MERKATO</title>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <a href="index.html">
            <h1>MERKATO</h1>
        </a>
        <nav>
    <a href="index.html">Home</a> &nbsp; / &nbsp;
    <a href="shop.html">Shop</a> &nbsp; / &nbsp;
    <a href="cart.html">Cart (0)</a> &nbsp; / &nbsp;
    <a href="login.html">Sign In</a>
</nav>
    </header>

    <hr>

    <!-- Main Content -->
    <main>
        <h2>Checkout</h2>

        <!-- Order Summary -->
        <section>
            <h3>Order Summary</h3>
            <ul>
                <li>Wolaita Roast (Medium, 1kg) — <strong>24.00 ETB</strong></li>
                <li>Shipping — <strong>Free</strong></li>
            </ul>
            <p><strong>Total: 24.00 </strong></p>
        </section>

        <hr>

        <!-- Shipping & Payment Form -->
        <form action="#" method="POST">
            
            <!-- Customer Details -->
            <section>
                <h3>1. Shipping Information</h3>
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Abebe Bikila" required>
                </p>
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="abebe@example.com" required>
                </p>
                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="+251 91 123 4567" required>
                </p>
                <p>
                    <label for="address">Delivery Address:</label><br>
                    <textarea id="address" name="address" rows="3" placeholder="Street name, Sub-city, City" required></textarea>
                </p>
            </section>

            <br>

            <!-- Payment Method -->
            <section>
                <h3>2. Payment Method</h3>
                <p>
                    <input type="radio" id="telebirr" name="payment" value="telebirr" checked>
                    <label for="telebirr">Telebirr / Mobile Money</label>
                </p>
                <p>
                    <input type="radio" id="cod" name="payment" value="cod">
                    <label for="cod">Cash on Delivery</label>
                </p>
                <p>
                    <input type="radio" id="card" name="payment" value="card">
                    <label for="card">Credit / Debit Card</label>
                </p>
            </section>

            <br>

            <button type="submit">Complete Order &rarr;</button>

        </form>
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p><small>&copy; 2026 MERKATO. Simple, authentic commerce.</small></p>
    </footer>

</body>
</html>
