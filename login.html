<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MERKATO - Ethiopian digital supermarket with authentic products, electronics, and traditional items.">
<meta name="keywords" content="Ethiopian supermarket, MERKATO, coffee, teff, electronics, Addis Ababa">
<meta name="author" content="ABENEZER MATHEWOS">
    <title>Account Sign In — MERKATO</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23008000'/><path d='M 22 75 L 22 25 L 50 60 L 78 25 L 78 75' stroke='%23FFFFFF' stroke-width='12' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='50' cy='63' r='4' fill='%23FFD700'/></svg>"></head>
<body>

    <!-- Header & Navigation -->
    <header>
        <a href="index.html">
            <h1>MERKATO</h1>
        </a>
        <nav>
            <a href="index.html">Home</a> &nbsp; / &nbsp;
            <a href="shop.html">Shop</a> &nbsp; / &nbsp;
            <a href="cart.html">Cart (0)</a> &nbsp; / &nbsp;
            <a href="login.html"><strong>Sign In</strong></a>
        </nav>
    </header>

    <hr>

    <!-- Main Content -->
    <main>
        
        <!-- Sign In Section -->
        <section>
            <h2>Sign In to Your Account</h2>
            <form action="index.html" method="GET">
                <p>
                    <label for="login-email">Email Address:</label><br>
                    <input type="email" id="login-email" name="email" placeholder="name@example.com" required>
                </p>
                <p>
                    <label for="login-password">Password:</label><br>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </p>
                <p>
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember"><small>Remember me</small></label>
                </p>
                <button type="submit">Sign In &rarr;</button>
            </form>
        </section>

        <hr>

        <!-- New Account Section -->
        <section>
            <h3>New to Merkato?</h3>
            <p>Create an account to track your orders, save delivery addresses, and receive special offers.</p>

            <details>
                <summary><strong>Create an Account</strong></summary>
                <br>
                <form action="index.html" method="GET">
                    <p>
                        <label for="reg-name">Full Name:</label><br>
                        <input type="text" id="reg-name" name="fullname" placeholder="Abebe Bikila" required>
                    </p>
                    <p>
                        <label for="reg-email">Email Address:</label><br>
                        <input type="email" id="reg-email" name="email" placeholder="name@example.com" required>
                    </p>
                    <p>
                        <label for="reg-phone">Phone Number:</label><br>
                        <input type="tel" id="reg-phone" name="phone" placeholder="+251 91 123 4567" required>
                    </p>
                    <p>
                        <label for="reg-password">Create Password:</label><br>
                        <input type="password" id="reg-password" name="password" placeholder="••••••••" required minlength="6">
                    </p>
                    <button type="submit">Create Account &rarr;</button>
                </form>
            </details>
        </section>

    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p><small>&copy; 2026 MERKATO. Simple, authentic commerce.</small></p>
    </footer>

</body>
</html>
