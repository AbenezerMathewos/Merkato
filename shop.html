<!DOCTYPE html>

<body bgcolor="#FAFAFA" text="#222222">

    <!-- Navigation Header -->
    <table width="90%" align="center" cellpadding="8" cellspacing="0">
        <tr>
            <td width="30%">
                <a href="index.html" style="text-decoration:none;">
                    <font size="6" color="#111111"><strong>MERKATO</strong></font>
                </a>
            </td>
            <td width="40%" align="center">

                </form>
            </td>
            <td width="30%" align="right">
                <nav>
                    <a href="index.html">Home</a> &nbsp;&vert;&nbsp;

    <hr size="1" color="#DDDDDD" width="90%">

    <!-- Main Grid -->
    <main>
        <table width="90%" align="center" cellpadding="12" cellspacing="0">

                <td width="22%" bgcolor="#FFFFFF" style="border: 1px solid #E0E0E0;">
                    <h3>Collection Filter</h3>
                    <details open>
                        <summary><strong>Categories</strong></summary>
                        <p><input type="checkbox" id="c1" checked> <label for="c1">All Items</label></p>
                        <p><input type="checkbox" id="c2"> <label for="c2">Coffee &amp; Teas</label></p>
                        <p><input type="checkbox" id="c3"> <label for="c3">Spices</label></p>

                    </details>
                </td>

                <td width="3%"></td> <!-- Spacer Column -->

                <!-- 2x2 Clean Product Grid -->
                <td width="75%">
                    <table width="100%" cellpadding="12" cellspacing="12">
                        <!-- Row 1 -->
                        <tr valign="top">
                            <td width="50%" align="center" bgcolor="#FFFFFF" style="border: 1px solid #E0E0E0;">
                                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=300&q=80" alt="Yirgacheffe Coffee" width="150" height="150" style="object-fit: cover;">
                                <h4>Yirgacheffe Roast (1kg)</h4>
                                <p><strong>$24.00</strong></p>
                                <form action="checkout.html" method="GET">
                                    <button type="submit">Add to Cart</button>
                                </form>
                            </td>

                            <td width="50%" align="center" bgcolor="#FFFFFF" style="border: 1px solid #E0E0E0;">
                                <img src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=300&q=80" alt="Spices" width="150" height="150" style="object-fit: cover;">
                                <h4>Artisanal Berbere Spice</h4>
                                <p><strong>$12.00</strong></p>
                                <form action="checkout.html" method="GET">
                                    <button type="submit">Add to Cart</button>
                                </form>
                            </td>
                        </tr>

                        <!-- Row 2 -->
                        <tr valign="top">
                            <td width="50%" align="center" bgcolor="#FFFFFF" style="border: 1px solid #E0E0E0;">
                                <img src="https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?auto=format&fit=crop&w=300&q=80" alt="Pottery" width="150" height="150" style="object-fit: cover;">
                                <h4>Clay Jebena Coffee Pot</h4>
                                <p><strong>$18.50</strong></p>
                                <form action="checkout.html" method="GET">
                                    <button type="submit">Add to Cart</button>
                                </form>
                            </td>

                            <td width="50%" align="center" bgcolor="#FFFFFF" style="border: 1px solid #E0E0E0;">
                                <img src="https://images.unsplash.com/photo-1601924994987-69e26d50dc26?auto=format&fit=crop&w=300&q=80" alt="Textile" width="150" height="150" style="object-fit: cover;">
                                <h4>Handwoven Cotton Scarf</h4>
                                <p><strong>$35.00</strong></p>
                                <form action="checkout.html" method="GET">
                                    <button type="submit">Add to Cart</button>
                                </form>
                            </td>
                        </tr>
                    </table>
                </td>

            </tr>
